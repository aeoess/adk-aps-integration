name: CI

on:
  push:
    branches: [main, integration-skeleton, feat/protect-mcp-adk-composition]
  pull_request:

jobs:
  matrix:
    name: py=${{ matrix.python }} aps=${{ matrix.aps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
        aps:
          - "agent-passport-system"            # PyPI latest
          - "agent-passport-system==2.0.0b0"   # next-gen beta on PyPI
        verify:
          - "@veritasacta/verify@0.3.0"        # latest === 0.3.0 today
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install APS SDK (${{ matrix.aps }})
        run: pip install "${{ matrix.aps }}"

      - name: Install protect-mcp-adk
        run: pip install protect-mcp-adk

      - name: Pre-cache verifier (${{ matrix.verify }})
        run: npm install --no-save "${{ matrix.verify }}"

      # ── Example 1: basic-tool-call (APS-only signing) ─────────────────
      - name: Run basic-tool-call example
        working-directory: examples/basic-tool-call
        run: python run.py

      - name: Verify basic-tool-call receipts
        working-directory: examples/basic-tool-call
        run: ../../verify.sh receipts/

      # ── Example 2: full-composition (APS delegation + protect-mcp-adk) ─
      - name: Run full-composition example
        working-directory: examples/full-composition
        run: python run.py

      - name: Verify full-composition receipts
        working-directory: examples/full-composition
        run: ../../verify.sh receipts/

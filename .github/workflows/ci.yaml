name: CI

on:
  push:
    branches: [main, integration-skeleton]
  pull_request:

jobs:
  matrix:
    name: aps=${{ matrix.aps }} verify=${{ matrix.verify }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        aps:
          - "agent-passport-system"              # PyPI latest
          - "agent-passport-system @ git+https://github.com/aeoess/agent-passport-python@next"
          - "agent-passport-system==2.0.0b0"
        verify:
          - "@veritasacta/verify@0.3.0"
          - "@veritasacta/verify@latest"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install APS SDK (${{ matrix.aps }})
        run: pip install "${{ matrix.aps }}"

      - name: Install verifier (${{ matrix.verify }})
        run: npm install --no-save "${{ matrix.verify }}"

      - name: Run basic-tool-call example
        working-directory: examples/basic-tool-call
        run: python run.py

      - name: Verify receipts
        working-directory: examples/basic-tool-call
        run: ../../verify.sh receipts/
